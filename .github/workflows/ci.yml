name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck
      
      - name: Run linter
        run: npm run lint
      
      - name: Build application
        run: npm run build

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Build Cloud Functions
        run: npm --prefix functions run build

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit and Firestore emulator tests
        run: npx --yes firebase-tools@14 emulators:exec --project demo-shadowtalk-auth-rules --only firestore "npm test"

  security:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run npm audit
        run: npm audit --audit-level=high --package-lock-only
        continue-on-error: true
